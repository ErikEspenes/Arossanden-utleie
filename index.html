  // ---------- Uker (ISO). Uka hører til måneden torsdagen faller i ----------
  function weeksInYear(y){ const j = new Date(Date.UTC(y,0,1)).getUTCDay(); const leap = (y%4===0 && y%100!==0) || y%400===0; return (j===4 || (leap && j===3)) ? 53 : 52; }
  function week1Monday(y){ const d = new Date(Date.UTC(y,0,4)); d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7)); return d; }
  const cache = {};
  function weeksOf(y){
    if (cache[y]) return cache[y];

    for (let w=1; w<=weeksInYear(y); w++){
      const mon = new Date(m1); mon.setUTCDate(m1.getUTCDate()+7*(w-1));
      const thu = new Date(mon); thu.setUTCDate(mon.getUTCDate()+3);
      const sun = new Date(mon); sun.setUTCDate(mon.getUTCDate()+6);
      const month = thu.getUTCMonth();
      out.push({ key:`${y}-${String(w).padStart(2,"0")}`, w, month, high:HOY_MND.includes(month), periode:`${y}-H${month<=5?1:2}`,
        label:`${mon.getUTCDate()}. ${MND_K[mon.getUTCMonth()]} – ${sun.getUTCDate()}. ${MND_K[sun.getUTCMonth()]}` });
    }
    return (cache[y] = out);
  }

    const y = d.getUTCFullYear(), w = 1+Math.round((d-week1Monday(y)-3*864e5)/6048e5);

  }

      <div class="row">${andre.map(x => `<button class="btn sm" data-pick="${x}">Gå til ${esc(en(x))}</button>`).join("")}</div>` : ""}</div>` : "";
    const halvKnapp = h => { const p = `${S.year}-${h}`, b = bekreftet(n, p);
      const st = b ? `<em class="ok">✓ Bekreftet</em>` : kanBekrefte(p) && !S.laast.has(p) ? `<em class="miss">Må bekreftes</em>` : S.laast.has(p) ? `<em>🔒 Låst</em>` : `<em>Pågår</em>`;
      return `<button data-half="${h}" aria-pressed="${S.half===h}"><b>${HALV[h]}</b><span>${HALV_MND[h]}</span>${st}</button>`; };
    const maaned = m => `<section class="month"><h3>${MND[m]}${HOY_MND.includes(m) ? `<small class="hi">Høysesong · ${PRIS_HOY} kr/uke</small>` : `<small>Lavsesong · ${PRIS_LAV} kr/uke</small>`}</h3>
      <div class="weeks">${weeks.filter(w => w.month === m).map(w => {
        const on = uker.has(w.key), closed = S.laast.has(w.periode) || !!bekreftet(n, w.periode);
        return `<button class="wk${on?" on":""}${w.high?" high":""}${w.key===now?" now":""}${closed?" closed":""}" data-wk="${w.key}" aria-pressed="${on}" ${closed?'aria-disabled="true"':""}
          aria-label="Uke ${w.w}, ${w.label}, ${on ? "utleid" : "ikke utleid"}${closed ? ", lukket" : ""}">
          <span class="wn">Uke ${w.w}</span><span class="wd">${w.label}</span>
          <span class="ws">${closed ? (on ? "✓ Utleid 🔒" : "🔒 Lukket") : on ? "✓ Utleid" : "Ikke utleid"}</span></button>`; }).join("")}</div></section>`;
    const hoyreKnapp = S.admin ? `<button class="btn ghost sm" data-tab="over">← Tilbake til oversikt</button>`
      : flereEnheter() ? `<button class="btn ghost sm" data-act="bytt">Bytt hytte</button>` : "";
    return `${installKort()}<div class="panel">
      <div class="unithead"><div><p class="muted">Du registrerer for</p><h2 class="big">${esc(en(n))}</h2>${adr(n) ? `<p class="muted">${esc(adr(n))}</p>` : ""}
        ${eiereFor(n).length ? `<p class="owner">${eiereFor(n).map(x => `${esc(x.navn)} <small>(${rolleTxt(x.rolle)})</small>`).join(", ")}</p>` : ""}</div>${hoyreKnapp}</div>
      ${varsel}
      <div class="howto"><h3>Slik gjør du det</h3><ol>
        <li><i>1</i><span>Trykk på hver uke hytta har vært <b>utleid</b>. Uka blir farget og <b>lagres automatisk</b>.</span></li>
        <li><i>2</i><span>Trykket feil? Trykk på uka <b>en gang til</b>, så fjernes den.</span></li>
        <li><i>3</i><span>Når halvåret er over: trykk den <b>grønne knappen</b> nederst for å bekrefte.</span></li></ol>
        <p class="muted" style="margin:10px 0 0;font-size:.9rem">Leid ut én dag eller hele uka? Det teller som én uke.</p></div>
      <div class="halfswitch">${halvKnapp("H1")}${halvKnapp("H2")}</div>
      ${yearbar()}
      <div class="halfsum"><span>Utleid ${HALV[S.half]} ${S.year}: ${ukerTxt(t.lav + t.hoy)}</span><span>${kr(t.total)}</span></div>
      ${ms.map(maaned).join("")}
      ${bekreftBoks(n, S.half)}
      <div class="legend"><span><i style="background:var(--sea)"></i>Utleid lavsesong</span><span><i style="background:var(--sun)"></i>Utleid høysesong</span><span>Stiplet ramme: denne uka</span></div>
      ${statusEl()}
      ${S.admin || !S.eier ? "" : `<div class="minfo"><h3>Mine kontaktopplysninger</h3>
        <p><b>${esc(S.eier.navn)}</b><br>${S.eier.epost ? esc(S.eier.epost) : "E-post mangler"}<br>${S.eier.mobil ? esc(tlf(S.eier.mobil)) : "Mobilnummer mangler"}</p>
        <p class="muted">Er noe feil eller endret? Gi beskjed til styret.</p></div>`}
      ${S.admin ? "" : `<p class="center" style="margin-top:22px">${!erApp() && hent("arossanden-skjul-install") ? `<button class="linkbtn" data-act="visinstalligjen">Legg appen på hjemskjermen</button> · ` : ""}<button class="linkbtn" data-act="loggut">Logg ut</button></p>`}</div>`;
  }

  // ---------- Status ----------
  function statusView(){
    const halv = ["H1","H2"].map(h => { const per = `${S.year}-${h}`, ok = [], miss = [];
      for (let n=1; n<=ANTALL_ENHETER; n++) (bekreftet(n, per) ? ok : miss).push(n);
      return { h, per, open:kanBekrefte(per), ok, miss }; });
    const kort = x => `<div class="scard ${!x.open ? "wait" : x.miss.length ? (fristPassert(x.per) ? "late" : "") : "ok"}">
      <h3>${HALV[x.h]} ${S.year}</h3>
      ${x.open ? `<p class="bigp"><b>${x.ok.length}</b> av ${ANTALL_ENHETER} har bekreftet</p>
        <div class="progress"><i style="width:${Math.round(x.ok.length/ANTALL_ENHETER*100)}%"></i></div>
        <p>${fristFor(x.per) ? `Frist ${dato(fristFor(x.per))}${fristPassert(x.per) ? " (passert)" : ""}` : "Frist ikke satt"}${S.laast.has(x.per) ? " · låst 🔒" : ""}</p>
        ${x.miss.length ? `<p class="miss"><b>Mangler (${x.miss.length}):</b> ${esc(x.miss.join(", "))}</p>` : `<p class="okt"><b>Alle enheter har bekreftet ✓</b></p>`}`
      : `<p>Kan bekreftes fra ${dato(aapnerDato(x.per))}${fristFor(x.per) ? `, frist ${dato(fristFor(x.per))}` : ""}.</p>`}</div>`;
    const merke = (n, x) => !x.open ? `<span class="m wait">${x.h}</span>` : bekreftet(n, x.per) ? `<span class="m ok">${x.h} ✓</span>` : `<span class="m miss">${x.h} ✗</span>`;
    const tiles = Array.from({length:ANTALL_ENHETER}, (_,i) => { const n = i+1;
      return `<div class="tile ${halv.some(x => x.open && !bekreftet(n, x.per)) ? "miss" : ""}"><b>${n}</b>${S.enhetsnavn.has(n) ? `<span class="tn">${esc(S.enhetsnavn.get(n))}</span>` : ""}<span class="tm">${halv.map(x => merke(n, x)).join("")}</span></div>`; }).join("");
    return `<div class="panel">${yearbar()}
      <p class="intro">Hvem har bekreftet utleien sin? Synlig for alle i sameiet.</p>
      <div class="scards">${halv.map(kort).join("")}</div>
      <div class="tiles">${tiles}</div>
      <div class="legend"><span>✓ Bekreftet</span><span>✗ Mangler</span><span>Grå: halvåret er ikke over</span></div></div>`;
  }

  // ---------- Oversikt (styret) ----------
  const PERIODER = { H1:{navn:"1. halvår",f:i=>i.month<=5}, H2:{navn:"2. halvår",f:i=>i.month>=6}, aar:{navn:"Hele året",f:()=>true} };
  function unitRows(){
    const f = PERIODER[S.period].f, rows = [];
    for (let n=1; n<=ANTALL_ENHETER; n++){
      const keys = [...ukerFor(n)];
      const weeks = keys.filter(k => { const i = infoFor(k); return i && f(i); }).sort().map(k => Number(k.split("-")[1]));
      const b1 = bekreftet(n, `${S.year}-H1`), b2 = bekreftet(n, `${S.year}-H2`);
      const ok = S.period === "H1" ? !!b1 : S.period === "H2" ? !!b2 : (!!b1 && !!b2);
      rows.push({ n, ...sum(keys, f), weeks, b1, b2, ok });
    }
    return rows;
  }
  function oversiktView(){
    const rows = unitRows();
    const t = rows.reduce((a,r)=>({lav:a.lav+r.lav,hoy:a.hoy+r.hoy,total:a.total+r.total}),{lav:0,hoy:0,total:0});
    const per = S.period !== "aar" ? `${S.year}-${S.period}` : null, erLaast = per && S.laast.has(per);
    const antOk = rows.filter(r => r.ok).length;
    const statusCell = r => S.period === "aar"
      ? `<td>${["H1","H2"].map(h => { const p = `${S.year}-${h}`, b = h === "H1" ? r.b1 : r.b2;
          return b ? `<span class="tag ok">${h} ✓</span>` : !kanBekrefte(p) ? `<span class="tag">${h} –</span>` : `<span class="tag ${fristPassert(p) ? "late" : "warn"}">${h} ✗</span>`; }).join(" ")}</td>`
      : !kanBekrefte(per) && !r.ok ? `<td><span class="tag">Ikke over</span></td>`
      : `<td>${r.ok ? '<span class="tag ok">Bekreftet ✓</span>' : `<span class="tag ${fristPassert(per) ? "late" : "warn"}">Mangler</span>`}</td>`;
    const admin = `<div class="adminbox"><h3>Frist, rapport og låsing</h3>
      ${per ? `<div class="row" style="margin-bottom:12px"><label for="fristInp">Frist for ${PERIODER[S.period].navn.toLowerCase()}:</label>
        <input id="fristInp" type="date" value="${fristFor(per) || ""}"><button class="btn ghost sm" data-act="frist">Lagre frist</button></div>
        <p class="status" style="margin-top:0">${PERIODER[S.period].navn} ${S.year} er ${erLaast ? "låst. Ingen kan endre registreringer." : "åpen for registrering."}</p>
        <div class="row">${erLaast ? `<button class="btn" data-act="csv">Last ned rapport</button><button class="btn warn" data-act="opp">Lås opp</button>`
          : `<button class="btn" data-act="csvlaas">Lås og last ned rapport</button><button class="btn ghost" data-act="csv">Last ned uten å låse</button>`}</div>
        ${kanBekrefte(per) && antOk < ANTALL_ENHETER ? `<div class="row" style="margin-top:10px"><button class="btn ghost" data-act="purr">Kopier purretekst (${ANTALL_ENHETER - antOk} enheter)</button><button class="btn ghost" data-act="purrepost">Kopier e-postadresser</button></div>` : ""}`
      : `<div class="row"><button class="btn" data-act="csv">Last ned rapport for hele året</button></div>`}</div>`;
    return `<div class="panel">${yearbar()}
      <div class="row" style="justify-content:space-between"><div class="lockbar">${["H1","H2"].map(h => { const on = S.laast.has(`${S.year}-${h}`);
          return `<span class="${on?"on":""}">${HALV[h]}: ${on?"låst 🔒":"åpen"}</span>`; }).join("")}</div>
        <select id="periodSel" aria-label="Periode">${Object.entries(PERIODER).map(([k,v])=>`<option value="${k}" ${k===S.period?"selected":""}>${v.navn}</option>`).join("")}</select></div>
      <p class="status"><b>${antOk} av ${ANTALL_ENHETER}</b> har bekreftet ${S.period === "aar" ? "begge halvår" : PERIODER[S.period].navn.toLowerCase()} ${S.year}.${per && fristFor(per) ? ` Frist: ${dato(fristFor(per))}.` : ""}</p>
      <div class="progress"><i style="width:${Math.round(antOk/ANTALL_ENHETER*100)}%"></i></div>
      ${admin}
      <div class="scroll"><table>
        <thead><tr><th>Enhet</th><th>Status</th><th class="num">Lav</th><th class="num">Høy</th><th class="num">Sum</th><th class="ukecol">Uker</th></tr></thead>
        <tbody>${rows.map(r => `<tr class="click${S.aapen === r.n ? " open" : ""}" data-unit="${r.n}" tabindex="0" aria-expanded="${S.aapen === r.n}"><td><b>${r.n}</b>${S.enhetsnavn.has(r.n) ? `<small class="cn">${esc(S.enhetsnavn.get(r.n))}</small>` : ""}</td>${statusCell(r)}<td class="num">${r.lav}</td><td class="num">${r.hoy}</td><td class="num">${kr(r.total)}</td><td class="ukecol">${r.weeks.join(", ")}</td></tr>`
          + (S.aapen === r.n ? `<tr class="detail"><td colspan="6"><b>${esc(en(r.n))}</b>${adr(r.n) ? `, ${esc(adr(r.n))}` : ""}
            ${eiereFor(r.n).length ? eiereFor(r.n).map(x => `<span class="kline">${esc(x.navn)} <small>(${rolleTxt(x.rolle)})</small>: ${kontaktHtml(x) || "ingen kontaktinfo"}</span>`).join("") : `<span class="kline">Ingen eier registrert</span>`}
            <span class="kline">${PERIODER[S.period].navn} ${S.year}: ${r.weeks.length ? "uke " + r.weeks.join(", ") : "ingen uker registrert"}</span>
            <button class="btn ghost sm" data-edit="${r.n}">Rediger enhet</button></td></tr>` : "")).join("")}</tbody>
        <tfoot><tr><td>Totalt</td><td></td><td class="num">${t.lav}</td><td class="num">${t.hoy}</td><td class="num">${kr(t.total)}</td><td class="ukecol"></td></tr></tfoot>
      </table></div><p class="status">Trykk på en enhet for å se ukene.</p>${statusEl()}</div>`;
  }

  // ---------- Eiere (styret) ----------
  function eierSkjema(){
    const e = S.redigerEier, hoved = new Set(e.hoved), med = new Set(e.med);
    const andre = new Map();
    for (const x of S.eiere) if (x.id !== e.id) for (const s of (x.eierskap || [])) andre.set(s.enhet, (andre.get(s.enhet) ? andre.get(s.enhet) + ", " : "") + x.navn);
    const grid = (rolle, valgt) => `<div class="chkgrid">${Array.from({length:ANTALL_ENHETER}, (_,i) => { const n = i+1;
      return `<label class="chk${valgt.has(n) ? " on" : ""}${andre.has(n) ? " tatt" : ""}" title="${esc(en(n))}${andre.has(n) ? " · registrert på " + esc(andre.get(n)) : ""}">
        <input type="checkbox" data-rolle="${rolle}" data-enh="${n}" ${valgt.has(n) ? "checked" : ""}><b>${n}</b></label>`; }).join("")}</div>`;
    return `<div class="hbox open" id="skjema" style="margin-top:0;margin-bottom:16px"><h4>${e.id ? "Rediger eier" : "Ny eier"}</h4>
      <label for="eierNavn"><b>Navn</b> (person eller selskap)</label>
      <input id="eierNavn" class="txt" type="text" value="${esc(e.navn)}" placeholder="F.eks. Kari Hansen" autocomplete="off">
      <div class="to"><div><label for="eierEpost"><b>E-post</b></label><input id="eierEpost" class="txt" type="email" value="${esc(e.epost || "")}" autocomplete="off"></div>
        <div><label for="eierMobil"><b>Mobil</b></label><input id="eierMobil" class="txt" type="tel" value="${esc(e.mobil || "")}" autocomplete="off"></div></div>
      <p style="margin:14px 0 6px"><b>Kontaktperson for</b> (seksjonsnummer)</p>${grid("hovedeier", hoved)}
      <p style="margin:14px 0 6px"><b>Medeier for</b> (seksjonsnummer)</p>${grid("medeier", med)}
      <p class="muted" style="font-size:.85rem;margin-top:8px">Stiplet ramme: enheten har allerede en annen eier. Hold musepekeren over for navn.</p>
      <div class="row" style="margin-top:12px"><button class="btn green" data-act="lagreeier">Lagre</button><button class="btn ghost" data-act="avbryteier">Avbryt</button></div></div>`;
  }
  function enhetsnavnSkjema(){
    const rader = Array.from({length:ANTALL_ENHETER}, (_,i) => { const n = i+1;
      return `<div class="navnrad"><label for="en${n}"><b>${n}</b></label>
        <input id="en${n}" class="txt" type="text" maxlength="40" value="${esc(S.enhetsnavn.get(n) || "")}" placeholder="Enhet ${n}" autocomplete="off" aria-label="Navn enhet ${n}">
        <input id="ea${n}" class="txt" type="text" maxlength="60" value="${esc(S.adresse.get(n) || "")}" placeholder="Adresse" autocomplete="off" aria-label="Adresse enhet ${n}"></div>`; }).join("");
    return `<div class="hbox open" id="navneskjema" style="margin-top:0;margin-bottom:16px"><h4>Navn og adresse på enheter</h4>
      <p>Navnet vises for eierne, i status, oversikt, QR-ark og rapport. Tomt navn gir standard («Enhet 12»). Nummeret til venstre er seksjonsnummeret og endres ikke.</p>
      <div class="navnliste">${rader}</div>
      <div class="row" style="margin-top:14px"><button class="btn green" data-act="lagrenavn">Lagre alle</button><button class="btn ghost" data-act="enhetsnavn">Avbryt</button></div></div>`;
  }
  const smsTekst = e => `Hei! Her er din personlige lenke for registrering av utleie i Årossanden (${enListe(e.enheter)}): ${lenkeFor(e.token)} Hilsen styret`;
  const epostTekst = e => `Hei ${e.navn}!\n\nHer er din personlige lenke til appen for registrering av utleie i Årossanden:\n${lenkeFor(e.token)}\n\nTrykk på lenken, så kommer du rett inn på ${enListe(e.enheter)}.\nTips: Legg appen på hjemskjermen, så finner du den igjen med ett trykk. Appen viser deg hvordan.\n\nLenken er personlig. Ikke del den med andre.\n\nHilsen styret i Årossanden`;
  function eiereView(){
    const medEier = new Set(S.eiere.flatMap(e => e.enheter));
    const uten = Array.from({length:ANTALL_ENHETER}, (_,i) => i+1).filter(n => !medEier.has(n));
    const sok = S.eierSok.trim().toLowerCase();
    const liste = S.eiere.filter(e => !sok || [e.navn, e.epost, e.mobil, ...e.enheter.map(String), ...e.enheter.map(en), ...e.enheter.map(adr)].some(v => String(v || "").toLowerCase().includes(sok)));
    const roller = e => { const h = (e.eierskap || []).filter(s => s.rolle === "hovedeier").map(s => s.enhet), m = (e.eierskap || []).filter(s => s.rolle === "medeier").map(s => s.enhet);
      const fmt = a => a.map(n => `${n}. ${esc(en(n))}`).join(", ");
      return [h.length ? `<b>Kontaktperson:</b> ${fmt(h)}` : "", m.length ? `<b>Medeier:</b> ${fmt(m)}` : ""].filter(Boolean).join("<br>") || "Ingen enheter valgt"; };
    const kort = e => {
      const lenke = lenkeFor(e.token), vis = S.visQR === e.id;
      return `<div class="ecard">
        <div class="ehead"><div><h3>${esc(e.navn)}</h3><p class="roller">${roller(e)}</p><p class="kontakt">${kontaktHtml(e) || "Ingen kontaktinfo"}</p></div>
          <button class="btn sm ${vis ? "" : "ghost"}" data-qr="${e.id}">${vis ? "Skjul" : "Lenke og QR"}</button></div>
        ${vis ? `<div class="qrbox"><div class="qr">${qrSvg(lenke)}</div>
          <p class="lenke">${esc(lenke)}</p>
          <div class="row">${e.epost ? `<a class="btn sm green" href="mailto:${esc(e.epost)}?subject=${encodeURIComponent("Din lenke til utleieregistrering i Årossanden")}&body=${encodeURIComponent(epostTekst(e))}">✉️ Send på e-post</a>` : ""}
          ${e.mobil ? `<a class="btn sm green" href="sms:+47${esc(e.mobil)}?&body=${encodeURIComponent(smsTekst(e))}">💬 Send på SMS</a>` : ""}
          <button class="btn sm" data-kopier="${e.id}">Kopier lenke</button>
          ${DEMO ? `<button class="btn sm ghost" data-demo="${esc(e.token)}">Åpne som denne eieren</button>` : ""}</div></div>` : ""}
        <div class="row" style="margin-top:10px"><button class="btn sm ghost" data-rediger="${e.id}">Rediger</button>
          <button class="btn sm ghost" data-nytoken="${e.id}">Ny lenke</button><button class="btn sm warn" data-slett="${e.id}">Slett</button></div></div>`;
    };
    return `<div class="panel"><div class="row" style="justify-content:space-between"><h2>Eiere og innlogging</h2>
        <div class="row"><button class="btn green sm" data-act="nyeier">+ Ny eier</button>${S.eiere.length ? `<button class="btn ghost sm" data-act="utskrift">Skriv ut QR-ark</button><button class="btn ghost sm" data-act="alleepost">Kopier alle e-poster</button>` : ""}</div></div>
      <p class="intro">Hver eier (kontaktperson og medeier) får en personlig lenke og QR-kode. Den gir kun tilgang til eierens egne enheter. «Ny lenke» gjør den gamle ugyldig, f.eks. ved eierskifte.</p>
      <div class="row" style="margin-bottom:12px"><button class="btn ${S.visEnhetsnavn ? "" : "ghost"} sm" data-act="enhetsnavn">✏️ Navn og adresse på enheter</button></div>
      ${S.visEnhetsnavn ? enhetsnavnSkjema() : ""}
      ${uten.length ? `<p class="alertline">Enheter uten eier (${uten.length}): ${esc(uten.join(", "))}</p>` : `<p class="okline">✓ Alle ${ANTALL_ENHETER} enheter har eier. ${S.eiere.length} eiere registrert.</p>`}
      ${S.redigerEier ? eierSkjema() : ""}
      <input id="eierSok" class="txt" type="search" value="${esc(S.eierSok)}" placeholder="🔍 Søk navn, e-post, mobil eller enhet" autocomplete="off" aria-label="Søk i eiere">
      <div class="elist">${liste.map(kort).join("") || `<p class="muted">${S.eiere.length ? "Ingen treff." : "Ingen eiere registrert ennå. Trykk «+ Ny eier»."}</p>`}</div>${statusEl()}</div>`;
  }
  function utskriftView(){
    const ark = S.eiere.filter(e => e.enheter.length).map(e => `<div class="qrark">
      <h2>Årossanden utleie</h2><p class="enav">${esc(e.navn)}</p><p>${e.enheter.map(n => esc(en(n)) + (adr(n) ? ` (${esc(adr(n))})` : "")).join("<br>")}</p>
      <div class="qr">${qrSvg(lenkeFor(e.token))}</div>
      <p><b>Skann koden med kameraet på mobilen</b> for å registrere utleie.</p>
      <p class="lenke">${esc(lenkeFor(e.token))}</p>
      <p><b>Tips:</b> Legg appen på hjemskjermen etter første gang. Appen viser deg hvordan.</p>
      <p class="muted">Lenken er personlig. Ikke del den med andre.</p></div>`).join("");
    return `<div class="noprint panel" style="margin-bottom:14px"><div class="row"><button class="btn" data-act="skrivut">🖨 Skriv ut</button><button class="btn ghost" data-act="lukkutskrift">Tilbake</button></div>
      <p class="muted">Ett ark per eier. Klipp ut og del ut, eller send som bilde.</p></div><div class="arkliste">${ark}</div>`;
  }

  // ---------- Logg (styret) ----------
  const HANDLING = { "lagt til":"Uke registrert", "fjernet":"Uke fjernet", "bekreftet":"Halvår bekreftet", "bekreftelse angret":"Halvår åpnet av styret",
    "låst":"Halvår låst (rapport)", "enhetsnavn oppdatert":"Navn og adresse på enheter oppdatert", "eiere importert":"Eierliste importert", "låst opp":"Halvår låst opp", "frist fjernet":"Frist fjernet" };
  function hvaTekst(u){
    if (!u) return "";
    if (/^\d{4}-\d{2}$/.test(u)){ const i = infoFor(u); return `uke ${i.w} (${i.label}, ${u.slice(0,4)})`; }
    if (/^\d{4}-H[12]$/.test(u)) return `${HALV[u.slice(5)]} ${u.slice(0,4)}`;
    return u;
  }
  function loggTekst(l){
    const h = l.handling || "", hva = hvaTekst(l.uke);
    if (h.startsWith("frist satt: ")) return `Frist for ${hva} satt til ${h.slice(12)}`;
    if (h.startsWith("eier lagret: ")) return `Eier lagret: ${h.slice(13).replace(/hovedeier/g, "kontaktperson")}`;
    if (h.startsWith("eier slettet: ")) return `Eier slettet: ${h.slice(14)}`;
    if (h.startsWith("ny lenke laget: ")) return `Ny lenke laget for ${h.slice(16)}`;
    return (HANDLING[h] || h) + (hva ? ": " + hva : "");
  }
  async function lastLogg(){
    const { data, error } = await sb.rpc("hent_logg", { p_nokkel:adminKey, p_enhet:S.loggEnhet ? Number(S.loggEnhet) : null, p_antall:300 });
    if (error){ setStatus("Kunne ikke hente logg: " + error.message, true); S.logg = []; } else S.logg = data || [];
  }
  function loggView(){
    const opts = `<option value="">Alle enheter</option>` + Array.from({length:ANTALL_ENHETER}, (_,i) => `<option value="${i+1}" ${String(i+1)===S.loggEnhet?"selected":""}>${i+1}. ${esc(en(i+1))}${navnFor(i+1) ? " · " + esc(navnFor(i+1)) : ""}</option>`).join("");
    const tid = t => new Date(t).toLocaleString("nb-NO", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"});
    const linjer = S.logg.map(l => `<li><time>${tid(l.tid)}</time><span>${l.enhet ? `<b>${esc(en(l.enhet))}</b> · ` : ""}${esc(loggTekst(l))}${l.av ? ` <em class="av">av ${esc(l.av)}</em>` : ""}</span></li>`).join("");
    return `<div class="panel"><h2>Endringslogg</h2>
      <p class="intro">Alle registreringer, bekreftelser og styrets endringer, med hvem som gjorde det. Nyeste først (siste 300).</p>
      <select id="loggSel" aria-label="Velg enhet">${opts}</select>
      ${S.logg.length ? `<ul class="logg">${linjer}</ul>` : `<p class="status">Ingen endringer funnet.</p>`}${statusEl()}</div>`;
  }

  function render(){
    let body;
    if (S.loading) body = `<p>Laster …</p>`;
    else if (S.admin){
      if (S.utskrift) body = utskriftView();
      else if (S.tab === "status") body = statusView();
      else if (S.tab === "eiere") body = eiereView();
      else if (S.tab === "logg") body = loggView();
      else if (S.tab === "min" && S.enhet) body = minHytteView();
      else body = oversiktView();
    } else if (!S.eier) body = loginView();
    else if (S.tab === "status") body = statusView();
    else if (!S.eier.enheter.length) body = `<div class="panel center"><h2 class="big">Ingen enheter</h2><p class="lead">Lenken din er ikke koblet til noen enhet ennå. Kontakt styret.</p></div>`;
    else if (!S.enhet) body = velgView();
    else body = minHytteView();
    app.innerHTML = (S.utskrift ? "" : header()) + body;
  }

  // ---------- Rapport ----------
  async function lastNedCsv(){
    const p = PERIODER[S.period].navn, rows = unitRows();
    const lines = [["Enhet nr","Enhet","Adresse","Kontaktperson","E-post kontaktperson","Medeier","Periode","Uker lavsesong","Uker høysesong","Beløp lavsesong (kr)","Beløp høysesong (kr)","Sum (kr)","Ukenummer","Bekreftet av enhet"].join(";")];
    const c = v => String(v || "").replace(/;/g, ",");
    rows.forEach(r => lines.push([r.n, c(en(r.n)), c(adr(r.n)), c(hovedFor(r.n).map(x => x.navn).join(" og ")), c(hovedFor(r.n).map(x => x.epost).filter(Boolean).join(", ")), c(medFor(r.n).map(x => x.navn).join(" og ")), `${p} ${S.year}`, r.lav, r.hoy, r.krLav, r.krHoy, r.total, r.weeks.join(", "),
      S.period === "aar" ? `H1: ${r.b1 ? dato(r.b1) : "nei"}, H2: ${r.b2 ? dato(r.b2) : "nei"}` : (r.ok ? dato(S.period === "H1" ? r.b1 : r.b2) : "nei")].join(";")));
    const t = rows.reduce((a,r)=>({lav:a.lav+r.lav,hoy:a.hoy+r.hoy,krLav:a.krLav+r.krLav,krHoy:a.krHoy+r.krHoy,total:a.total+r.total}),{lav:0,hoy:0,krLav:0,krHoy:0,total:0});
    lines.push(["Totalt","","","","","","",t.lav,t.hoy,t.krLav,t.krHoy,t.total,"",""].join(";"));
    const blob = new Blob(["\uFEFF" + lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
    const filename = `arossanden-utleie-${S.year}-${S.period}.csv`;
    if (window.claude){
      try { const dl = await claude.use("downloads"); if (dl){ await dl.save({ filename, data:blob }); return; } } catch(e){ if (e && (e.code==="cancelled"||e.code==="declined")) return; }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  async function settLaas(laast){
    const { data, error } = await sb.rpc("sett_laas", { p_nokkel:adminKey, p_periode:`${S.year}-${S.period}`, p_laast:laast });
    if (error || !data){ setStatus("Kunne ikke endre låsing: " + (error ? error.message : "ugyldig admin-nøkkel"), true); return false; }
    await lastData(); return true;
  }
  function velgStandardHalv(n){
    const m = mangler(n);
    return m.length ? gaaTil(m[0].y, m[0].h) : gaaTil(naaAar, naaHalv);
  }
  async function kopier(tekst, melding){
    try { await navigator.clipboard.writeText(tekst); toast(melding, "ok"); }
    catch(e){ setStatus("Kunne ikke kopiere automatisk. Kopier manuelt:\n" + tekst); render(); }
  }

  // ---------- Hendelser ----------
  app.addEventListener("click", async e => {
    const t = e.target.closest("button, tr[data-unit]"); if (!t || t.disabled) return;
    if (t.dataset.demo){
      if (t.dataset.demo === "styret"){ S.admin = true; S.tab = "over"; S.enhet = null; }
      else { S.admin = false; S.tab = "min"; lagre("arossanden-nokkel", t.dataset.demo); await loggInnEier(t.dataset.demo); }
      S.utskrift = false; S.loading = true; render(); await oppdater();
      if (!S.admin && S.enhet) await velgStandardHalv(S.enhet);
      window.scrollTo(0,0); return;
    }
    if (t.dataset.tab){ S.tab = t.dataset.tab; setStatus(""); if (S.tab === "over" && S.admin) S.enhet = null;
      if (S.tab === "logg"){ S.loading = true; render(); await lastLogg(); S.loading = false; } render(); window.scrollTo(0,0); return; }
    if (t.dataset.year){ const y = S.year + Number(t.dataset.year); if (y < FORSTE_AAR) return; setStatus(""); await gaaTil(y, S.half); return; }
    if (t.dataset.half){ S.half = t.dataset.half; S.bekreftSteg = null; render(); return; }
    if (t.dataset.goto){ const [y,h] = t.dataset.goto.split("-"); await gaaTil(Number(y), h); return; }
    if (t.dataset.pick){ const n = Number(t.dataset.pick); S.enhet = n; lagre("arossanden-enhet", String(n)); await velgStandardHalv(n); return; }
    if (t.dataset.edit){ S.enhet = Number(t.dataset.edit); S.aapen = null; if (S.period !== "aar") S.half = S.period; S.tab = "min"; setStatus(""); render(); window.scrollTo(0,0); return; }
    if (t.dataset.unit){ const n = Number(t.dataset.unit); S.aapen = S.aapen === n ? null : n; render(); return; }
    if (t.dataset.wk){
      const k = t.dataset.wk, info = infoFor(k);
      if (S.laast.has(info.periode)){ toast(SVAR.laast, "warn"); return; }
      if (bekreftet(S.enhet, info.periode)){ toast(SVAR.bekreftet, "warn"); return; }
      const had = ukerFor(S.enhet).has(k);
      if (had) S.rader = S.rader.filter(r => !(r.enhet === S.enhet && r.uke === k)); else S.rader.push({ enhet:S.enhet, uke:k });
      S.bekreftSteg = null; render();
      const { data, error } = S.admin
        ? await sb.rpc("admin_registrer_uke", { p_nokkel:adminKey, p_enhet:S.enhet, p_uke:k, p_utleid:!had })
        : await sb.rpc("registrer_uke", { p_token:S.token, p_enhet:S.enhet, p_uke:k, p_utleid:!had });
      if (error || data !== "ok"){
        await lastData(); render();
        toast(error ? "Ikke lagret. Sjekk nettforbindelsen og prøv igjen." : (SVAR[data] || "Ikke lagret."), "warn");
      } else toast(had ? `Uke ${info.w} er fjernet` : `✓ Uke ${info.w} er lagret som utleid`, had ? "" : "ok");
      return;
    }
    if (t.dataset.qr){ S.visQR = S.visQR === t.dataset.qr ? null : t.dataset.qr; render(); return; }
    if (t.dataset.kopier){ const x = S.eiere.find(e => e.id === t.dataset.kopier); if (x) await kopier(lenkeFor(x.token), `✓ Lenken til ${x.navn} er kopiert`); return; }
    if (t.dataset.rediger){ const x = S.eiere.find(e => e.id === t.dataset.rediger);
      S.redigerEier = { id:x.id, navn:x.navn, epost:x.epost, mobil:x.mobil, hoved:(x.eierskap || []).filter(s => s.rolle === "hovedeier").map(s => s.enhet), med:(x.eierskap || []).filter(s => s.rolle === "medeier").map(s => s.enhet) }; render(); document.getElementById("skjema")?.scrollIntoView({block:"start"}); return; }
    if (t.dataset.nytoken){
      const x = S.eiere.find(e => e.id === t.dataset.nytoken);
      if (!confirm(`Lage ny lenke for ${x.navn}? Den gamle lenken og QR-koden slutter å virke.`)) return;
      const { data, error } = await sb.rpc("admin_ny_token", { p_nokkel:adminKey, p_id:x.id });
      if (error || !data){ toast("Kunne ikke lage ny lenke.", "warn"); return; }
      await lastData(); S.visQR = x.id; render(); toast(`✓ Ny lenke laget for ${x.navn}. Del den nye QR-koden.`, "ok"); return;
    }
    if (t.dataset.slett){
      const x = S.eiere.find(e => e.id === t.dataset.slett);
      if (!confirm(`Slette ${x.navn}? Lenken slutter å virke. Registrerte uker for enhetene beholdes.`)) return;
      const { data, error } = await sb.rpc("admin_slett_eier", { p_nokkel:adminKey, p_id:x.id });
      if (error || !data){ toast("Kunne ikke slette.", "warn"); return; }
      await lastData(); render(); toast(`${x.navn} er slettet`); return;
    }
    const act = t.dataset.act;
    if (act === "bytt"){ S.enhet = null; lagre("arossanden-enhet", null); render(); window.scrollTo(0,0); return; }
    if (act === "loggut"){
      if (!confirm("Logge ut? Du må bruke lenken eller QR-koden for å komme inn igjen.")) return;
      lagre("arossanden-nokkel", null); lagre("arossanden-enhet", null); settLenkeNokkel(null); S.token = null; S.eier = null; S.enhet = null; render(); return;
    }
    if (act === "steg"){ S.bekreftSteg = t.dataset.per; render(); document.getElementById("bekreft")?.scrollIntoView({block:"center"}); return; }
    if (act === "avbryt"){ S.bekreftSteg = null; render(); return; }
    if (act === "bekreft" || act === "angre"){
      const per = t.dataset.per; S.bekreftSteg = null;
      const { data, error } = act === "angre"
        ? await sb.rpc("angre_bekreftelse", { p_nokkel:adminKey, p_enhet:S.enhet, p_periode:per })
        : S.admin ? await sb.rpc("admin_bekreft", { p_nokkel:adminKey, p_enhet:S.enhet, p_periode:per })
        : await sb.rpc("bekreft_halvaar", { p_token:S.token, p_enhet:S.enhet, p_periode:per });
      await lastData(); render();
      const ok = !error && (data === "ok" || data === true);
      if (!ok) toast(error ? "Ikke lagret: " + error.message : (SVAR[data] || "Ikke tillatt."), "warn");
      else toast(act === "bekreft" ? "✓ Takk! Halvåret er bekreftet." : "Halvåret er åpnet for endring.", "ok");
      document.getElementById("bekreft")?.scrollIntoView({block:"center"});
      return;
    }
    if (act === "enhetsnavn"){ S.visEnhetsnavn = !S.visEnhetsnavn; render(); if (S.visEnhetsnavn) document.getElementById("navneskjema")?.scrollIntoView({block:"start"}); return; }
    if (act === "lagrenavn"){
      const liste = Array.from({length:ANTALL_ENHETER}, (_,i) => ({ enhet:i+1, navn:(document.getElementById("en" + (i+1))?.value || "").trim(), adresse:(document.getElementById("ea" + (i+1))?.value || "").trim() }));
      const like = new Map(); for (const x of liste) if (x.navn){ const k = x.navn.toLowerCase(); like.set(k, (like.get(k) || []).concat(x.enhet)); }
      const dobbel = [...like.values()].filter(v => v.length > 1);
      if (dobbel.length){ toast(`To enheter kan ikke ha samme navn (nr. ${dobbel[0].join(" og ")}).`, "warn"); return; }
      const { data, error } = await sb.rpc("sett_enhetsnavn", { p_nokkel:adminKey, p_liste:liste });
      if (error || !data){ toast("Kunne ikke lagre: " + (error ? error.message : "ugyldig admin-nøkkel"), "warn"); return; }
      S.visEnhetsnavn = false; await lastData(); render(); toast("✓ Navn og adresser er lagret", "ok"); return;
    }
    if (act === "visinstall"){ S.visInstall = true; render(); return; }
    if (act === "lukkinstall"){ S.visInstall = false; render(); return; }
    if (act === "skjulinstall"){ lagre("arossanden-skjul-install", "1"); render(); toast("Du finner veiledningen igjen nederst på siden."); return; }
    if (act === "visinstalligjen"){ lagre("arossanden-skjul-install", null); S.visInstall = true; render(); window.scrollTo(0,0); return; }
    if (act === "installer" && installPrompt){ installPrompt.prompt(); try { const v = await installPrompt.userChoice; if (v && v.outcome === "accepted") lagre("arossanden-installert", "1"); } catch(e){} installPrompt = null; render(); return; }
    if (act === "nullstill"){ if (confirm("Slette alle testdata og starte på nytt?")) window.__demoReset(); return; }
    if (act === "nyeier"){ S.redigerEier = { id:null, navn:"", epost:"", mobil:"", hoved:[], med:[] }; render(); document.getElementById("eierNavn")?.focus(); return; }
    if (act === "avbryteier"){ S.redigerEier = null; render(); return; }
    if (act === "lagreeier"){
      const navn = document.getElementById("eierNavn").value.trim();
      const epost = document.getElementById("eierEpost").value.trim().toLowerCase(), mobil = document.getElementById("eierMobil").value.replace(/\D/g, "");
      const valgt = rolle => [...app.querySelectorAll(`input[data-rolle="${rolle}"]:checked`)].map(x => Number(x.dataset.enh));
      const hoved = valgt("hovedeier"), med = valgt("medeier").filter(n => !hoved.includes(n));
      if (!navn){ toast("Skriv inn navn.", "warn"); return; }
      if (epost && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(epost)){ toast("E-postadressen ser ikke riktig ut.", "warn"); return; }
      if (!hoved.length && !med.length){ toast("Velg minst én enhet.", "warn"); return; }
      const { data, error } = await sb.rpc("admin_lagre_eier", { p_nokkel:adminKey, p_id:S.redigerEier.id, p_navn:navn, p_epost:epost, p_mobil:mobil, p_hoved:hoved, p_med:med });
      if (error || !data){ toast(error && /e-post|duplicate|unik/i.test(error.message) ? "E-postadressen er allerede registrert på en annen eier." : "Kunne ikke lagre: " + (error ? error.message : "ugyldig admin-nøkkel"), "warn"); return; }
      S.redigerEier = null; S.visQR = data; await lastData(); render(); toast(`✓ ${navn} er lagret`, "ok"); return;
    }
    if (act === "utskrift"){ S.utskrift = true; render(); window.scrollTo(0,0); return; }
    if (act === "lukkutskrift"){ S.utskrift = false; render(); return; }
    if (act === "skrivut"){ window.print(); return; }
    if (act === "csv"){ await lastNedCsv(); return; }
    if (act === "frist"){
      const v = document.getElementById("fristInp").value || null;
      const { data, error } = await sb.rpc("sett_frist", { p_nokkel:adminKey, p_periode:`${S.year}-${S.period}`, p_frist:v });
      if (error || !data) setStatus("Kunne ikke lagre frist: " + (error ? error.message : "ugyldig admin-nøkkel"), true);
      else { setStatus(v ? `Frist satt til ${dato(v)}. Den vises for alle enheter.` : "Frist fjernet."); await lastData(); }
      render(); return;
    }
    if (act === "csvlaas"){
      if (!confirm(`Låse ${PERIODER[S.period].navn} ${S.year}? Ingen kan deretter endre registreringer i perioden.`)) return;
      if (await settLaas(true)){ setStatus(`${PERIODER[S.period].navn} ${S.year} er låst. Rapporten er lastet ned.`); render(); await lastNedCsv(); } else render();
      return;
    }
    if (act === "opp"){
      if (!confirm(`Låse opp ${PERIODER[S.period].navn} ${S.year}? Eierne kan da endre registreringer i perioden igjen.`)) return;
      if (await settLaas(false)) setStatus("Perioden er låst opp.");
      render(); return;
    }
    if (act === "purrepost" || act === "alleepost"){
      const enheter = act === "alleepost" ? null : new Set(unitRows().filter(r => !r.ok).map(r => r.n));
      const liste = [...new Set(S.eiere.filter(e => !enheter || e.enheter.some(n => enheter.has(n))).map(e => e.epost).filter(Boolean))];
      await kopier(liste.join(", "), `✓ ${liste.length} e-postadresser kopiert. Lim inn i «Blindkopi» i e-posten.`);
      return;
    }
    if (act === "demoaapne"){ const v = document.getElementById("demoSel").value; if (!v){ toast("Velg en eier i listen.", "warn"); return; }
      S.admin = false; S.tab = "min"; lagre("arossanden-nokkel", v); await loggInnEier(v); S.utskrift = false; S.loading = true; render(); await oppdater(); if (S.enhet) await velgStandardHalv(S.enhet); window.scrollTo(0,0); return; }
    if (act === "purr"){
      const mangl = unitRows().filter(r => !r.ok).map(r => r.n), per = `${S.year}-${S.period}`;
      const txt = `Hei!\n\nFølgende enheter har ikke bekreftet utleie for ${PERIODER[S.period].navn.toLowerCase()} ${S.year}:\n${mangl.map(en).join(", ")}\n\n${fristFor(per) ? `Fristen er ${dato(fristFor(per))}. ` : ""}Åpne appen med din personlige lenke eller QR-kode, sjekk ukene og trykk den grønne knappen «Bekreft».\n\nHilsen styret i Årossanden`;
      await kopier(txt, "✓ Purreteksten er kopiert. Lim inn i e-post, SMS eller Facebook.");
      return;
    }
  });
  app.addEventListener("change", async e => {
    if (e.target.id === "periodSel"){ S.period = e.target.value; S.aapen = null; setStatus(""); render(); }
    if (e.target.id === "loggSel"){ S.loggEnhet = e.target.value; await lastLogg(); render(); }
    if (e.target.matches("input[data-enh]")){
      e.target.closest(".chk").classList.toggle("on", e.target.checked);
      if (e.target.checked){ const annen = app.querySelector(`input[data-enh="${e.target.dataset.enh}"][data-rolle="${e.target.dataset.rolle === "hovedeier" ? "medeier" : "hovedeier"}"]`);
        if (annen && annen.checked){ annen.checked = false; annen.closest(".chk").classList.remove("on"); } }
    }
  });
  app.addEventListener("input", e => {
    if (e.target.id === "eierSok"){ S.eierSok = e.target.value; const pos = e.target.selectionStart; render(); const f = document.getElementById("eierSok"); if (f){ f.focus(); try { f.setSelectionRange(pos, pos); } catch(err){} } }
  });
  app.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("tr[data-unit]")) e.target.click(); });

  (async () => {
    if (DEMO){
      const { data } = await sb.rpc("admin_eiere", { p_nokkel:"demo" });
      S.demoEiere = data || [];
      if (window.__DEMO_ADMIN){ S.admin = true; S.tab = "over"; }
    } else if (adminKey){
      // Ingen egen «riktig/feil nøkkel»-funksjon: admin_eiere gir null ved feil nøkkel
      const { data, error } = await sb.rpc("admin_eiere", { p_nokkel:adminKey });
      S.admin = !error && Array.isArray(data);
      if (!S.admin){
        const k = adminKey.trim();
        S.adminFeil = error
          ? `Databasen svarte med feil: ${error.message}${error.code ? " (kode " + error.code + ")" : ""}`
          : !/^[0-9a-f]{64}$/i.test(k)
            ? `Nøkkelen i lenken har ${k.length} tegn${/[^0-9a-f]/i.test(k) ? " og inneholder tegn som ikke hører hjemme" : ""}. Den skal være nøyaktig 64 tegn (0–9 og a–f), uten «NOKKEL:» foran.`
            : "Nøkkelen har riktig format, men stemmer ikke med hashen som er lagret i Supabase. Nøkkel og hash er trolig fra to forskjellige kjøringer.";
      }
      if (S.admin) S.tab = "over";
    }
    if (!S.admin && S.token) await loggInnEier(S.token);
    await oppdater();
    if (!S.admin && S.enhet) await velgStandardHalv(S.enhet);
  })();
})();

</script>
</body>
